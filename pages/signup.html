<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ScanJO · Create account</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <link rel="stylesheet" href="../styles/signup.css">
</head>
<body>
  <main class="login-card signup-card">
    <div class="brand">
      <div class="logo-text">Scan<span>JO</span></div>
      <div class="logo-mark"><i class="fas fa-stethoscope"></i></div>
    </div>

    <div class="tagline">
      <i class="fas fa-circle-radiation"></i>
      Create your account and make your healthcare journey clearer.
    </div>

    <form id="signupForm" action="#" method="post">
      <div class="form-grid">
        <div class="form-group">
          <label for="name">Full name</label>
          <div class="input-wrapper">
            <i class="fas fa-user"></i>
            <input type="text" id="name" name="name" placeholder="Your full name" autocomplete="name" required>
          </div>
        </div>

        <div class="form-group">
          <label for="nationalNumber">National number</label>
          <div class="input-wrapper">
            <i class="fas fa-id-card"></i>
            <input type="text" id="nationalNumber" name="nationalNumber" placeholder="1234567890" inputmode="numeric" required>
          </div>
        </div>

        <div class="form-group">
          <label for="age">Date of birth</label>
          <div class="input-wrapper">
            <i class="fas fa-calendar"></i>
            <input type="date" id="age" name="age" autocomplete="bday" required>
          </div>
        </div>

        <div class="form-group">
          <label for="sex">Sex</label>
          <div class="input-wrapper">
            <i class="fas fa-venus-mars"></i>
            <select id="sex" name="sex" required>
              <option value="" selected disabled>Select sex</option>
              <option value="female">Female</option>
              <option value="male">Male</option>
            </select>
          </div>
        </div>

        <div class="form-group full-width">
          <label for="email">Email</label>
          <div class="input-wrapper">
            <i class="fas fa-envelope"></i>
            <input type="email" id="email" name="email" placeholder="you@example.com" autocomplete="email" required>
          </div>
        </div>

        <div class="form-group">
          <label for="phone">Phone number</label>
          <div class="input-wrapper">
            <i class="fas fa-phone"></i>
            <input type="tel" id="phone" name="phone" placeholder="+962 7X XXX XXXX" autocomplete="tel" required>
          </div>
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <div class="input-wrapper">
            <i class="fas fa-lock"></i>
            <input type="password" id="password" name="password" placeholder="Create a password" autocomplete="new-password" required>
          </div>
        </div>

        <div class="form-group full-width">
          <label for="address">Address</label>
          <div class="input-wrapper">
            <i class="fas fa-location-dot"></i>
            <input type="text" id="address" name="address" placeholder="City, area, and street" autocomplete="street-address" required>
          </div>
        </div>
      </div>

      <button type="submit" class="btn-login">
        <span>Create ScanJO account</span>
        <i class="fas fa-arrow-right"></i>
      </button>

      <p class="account-prompt">
        Already have an account?
        <a href="./login.html">log in</a>
      </p>
    </form>
  </main>

  <div class="floating-icons">
    <div class="icon-bubble"><i class="fas fa-flask"></i></div>
    <div class="icon-bubble"><i class="fas fa-heart"></i></div>
    <div class="icon-bubble"><i class="fas fa-stethoscope"></i></div>
    <div class="icon-bubble"><i class="fas fa-bone"></i></div>
    <div class="icon-bubble"><i class="fas fa-pills"></i></div>
    <div class="icon-bubble"><i class="fas fa-dna"></i></div>
    <div class="icon-bubble"><i class="fas fa-x-ray"></i></div>
    <div class="icon-bubble"><i class="fas fa-syringe"></i></div>
    <div class="icon-bubble"><i class="fas fa-notes-medical"></i></div>
    <div class="central-bubble">
      <i class="fas fa-plus"></i>
      <span>ScanJO</span>
    </div>
  </div>

</body>
</html>
